<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211a38">
    <title>Historial local | MarketOps</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="roles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <script defer src="demo-roles.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="encargado-view" x-data="demoHistorial(true)">
    <a class="skip-link" href="#contenido">Ir al contenido</a>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="encargado.html"><span class="brand-mark" aria-hidden="true"></span>MarketOps</a>
            <nav class="sidebar-nav" aria-label="Navegación principal">
                <a class="nav-equipment" href="encargado.html">Mi sucursal</a>
                <a class="nav-report" href="reporte-falla.html">Reportar falla</a>
                <a class="nav-history" href="historial-local.html" aria-current="page">Historial local</a>
            </nav>
            <div class="sidebar-bottom">
                <a class="sidebar-exit" href="index.html">Cerrar sesión</a>
            </div>
        </aside>
        <div class="app-main">
            <header class="topbar">
                <span class="topbar-role">Encargado de sucursal</span>
            </header>
            <main class="workspace" id="contenido">
                <div class="page-heading">
                    <div><h1>Historial local</h1><p>Sucursal Centro</p></div>
                    <a class="button" href="reporte-falla.html">+ Reportar falla</a>
                </div>
                <section class="panel" aria-labelledby="tituloHistorial">
                    <div class="panel-head"><h2 id="tituloHistorial">Reportes de fallas</h2></div>
                    <div class="filters" x-cloak>
                        <div class="field"><label for="buscarFalla">Buscar</label><input id="buscarFalla" type="search" x-model="buscar" placeholder="Equipo o falla"></div>
                        <div class="field"><label for="fechaFalla">Fecha del reporte</label><input id="fechaFalla" type="date" x-model="fecha"></div>
                        <button class="button--secondary" type="button" @click="fecha='';buscar=''">Limpiar filtros</button>
                    </div>
                    <div class="table-scroll" tabindex="0" role="region" aria-labelledby="tituloHistorial">
                        <table>
                            <thead><tr><th scope="col">Equipo</th><th scope="col">Falla</th><th scope="col">Fecha de reporte</th><th scope="col">Resolución</th></tr></thead>
                            <tbody>
                                <template x-for="i in visibles" :key="i.id">
                                    <tr><td x-text="i.equipo"></td><td class="incident-text" x-text="i.falla"></td><td x-text="i.fecha"></td><td x-text="i.resolucion"></td></tr>
                                </template>
                                <tr x-cloak x-show="visibles.length===0"><td colspan="4">No se encontraron reportes.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="pwa.js"></script>
</body>
</html>
