<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211a38">
    <title>Mi sucursal | MarketOps</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="roles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <script defer src="demo-roles.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="encargado-view" x-data="demoEncargado()">
    <a class="skip-link" href="#contenido">Ir al contenido</a>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="encargado.html"><span class="brand-mark" aria-hidden="true"></span>MarketOps</a>
            <nav class="sidebar-nav" aria-label="Navegación principal">
                <a class="nav-equipment" href="encargado.html" aria-current="page">Mi sucursal</a>
                <a class="nav-report" href="reporte-falla.html">Reportar falla</a>
                <a class="nav-history" href="historial-local.html">Historial local</a>
            </nav>
            <div class="sidebar-bottom">
                <a class="sidebar-exit" href="index.html">Cerrar sesión</a>
            </div>
        </aside>
        <div class="app-main">
            <header class="topbar">
                <span class="topbar-role">Encargado de sucursal</span>
            </header>
            <main class="workspace" id="contenido">
                <div class="page-heading">
                    <div><h1>Mi sucursal</h1><p>Sucursal Centro</p></div>
                    <a class="button" href="reporte-falla.html">+ Reportar falla</a>
                </div>
                <section class="panel" aria-labelledby="tituloEquipos">
                    <div class="panel-head"><h2 id="tituloEquipos">Equipos registrados</h2></div>
                    <div class="filters" x-cloak>
                        <div class="field">
                            <label for="buscarEquipo">Buscar equipo</label>
                            <input id="buscarEquipo" type="search" x-model="buscar" placeholder="Nombre del equipo">
                        </div>
                        <div class="field">
                            <label for="estadoEquipo">Estado</label>
                            <select id="estadoEquipo" x-model="filtro">
                                <option value="todos">Todos</option>
                                <option value="funcionando">Funcionando</option>
                                <option value="con falla">Con falla</option>
                                <option value="fuera de servicio">Fuera de servicio</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="ordenEquipos">Ordenar por</label>
                            <select id="ordenEquipos" x-model="orden"><option value="nombre">Nombre</option><option value="estado">Estado</option></select>
                        </div>
                    </div>
                    <div class="table-scroll" tabindex="0" role="region" aria-labelledby="tituloEquipos">
                        <table>
                            <thead><tr><th scope="col">Equipo</th><th scope="col">Tipo</th><th scope="col">Estado</th></tr></thead>
                            <tbody>
                                <template x-for="e in equiposVisibles" :key="e.id">
                                    <tr><td x-text="e.nombre"></td><td x-text="e.tipo"></td><td><span class="status" x-text="e.estado"></span></td></tr>
                                </template>
                                <tr x-cloak x-show="equiposVisibles.length===0"><td colspan="3">No hay resultados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <p class="table-note" aria-live="polite" x-text="equiposVisibles.length + ' equipos mostrados'"></p>
                </section>
            </main>
        </div>
    </div>
    <script src="pwa.js"></script>
</body>
</html>
