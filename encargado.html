<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi sucursal</title>
    <link rel="stylesheet" href="encargado.css">
</head>
<body>
    <header>

    <h1>MarketOps</h1>

    <nav aria-label="Menú del encargado">
        <a href="encargado.html" aria-current="page">Mi sucursal</a>
        <a href="reporte-falla.html">Reportar falla</a>
        <a href="historial-local.html">Historial local</a>
        <a href="index.html">Cerrar sesión</a>
    </nav>

    </header>

    <main>

    <h2>Mi sucursal</h2>
    <p>Sucursal Centro</p>

    <label for="filtro">Filtrar por estado:</label>
    <select id="filtro">
        <option value="todos">Todos</option>
        <option value="funcionando">Funcionando</option>
        <option value="con falla">Con falla</option>
        <option value="fuera de servicio">Fuera de servicio</option>
    </select>

    <div class="tabla" role="region" aria-label="Equipos de la sucursal" tabindex="0">
    <table>
        <thead>
            <tr>
                <th>Equipo</th>
                <th>Tipo</th>
                <th>Estado</th>
            </tr>
        </thead>
        
<tbody id="equipos">
    <tr>
        <td>Caja 1</td>
        <td>Caja</td>
        <td>
            <span class="estado funcionando">Funcionando</span>
        </td>
    </tr>

    <tr>
        <td>Balanza 1</td>
        <td>Balanza</td>
        <td>
            <span class="estado falla">Con falla</span>
        </td>
    </tr>

    <tr>
        <td>Impresora 1</td>
        <td>Impresora</td>
        <td>
            <span class="estado fuera">Fuera de servicio</span>
        </td>
    </tr>
</tbody>

    </table>
    </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
