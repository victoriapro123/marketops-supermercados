<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de soporte técnico MarketOps" />
    <title>Iniciar sesión | MarketOps</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="brand-panel" aria-label="MarketOps">
        <a class="brand" href="index.html" aria-label="Inicio MarketOps">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>MarketOps</span>
        </a>
      </section>

      <section class="login-panel">
        <form class="login-card" id="login-form">
          <header>
            <p class="eyebrow">Acceso al sistema</p>
            <h1>Iniciar sesión</h1>
          </header>

          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <label for="role">Perfil de demostración</label>
          <select id="role" name="role" required>
            <option value="">Selecciona un perfil</option>
            <option value="encargado">Encargado de sucursal</option>
            <option value="tecnico">Técnico de soporte</option>
            <option value="admin">Administrador</option>
          </select>

          <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>
          <button type="submit">Ingresar</button>
        </form>
      </section>
    </main>
    <script src="js/login.js"></script>
  </body>
</html>
