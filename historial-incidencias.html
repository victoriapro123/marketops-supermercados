<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de incidencias | MarketOps</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="roles.css">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><meta name="theme-color" content="#0f172a">
    <script defer src="demo-roles.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script></head>
<body class="roles-view" x-data="demoHistorial(false)">
<header class="roles-header"><div class="roles-brand">M <strong>MarketOps</strong></div><span>Historial de incidencias</span><a href="index.html">Cerrar sesión</a></header>
<nav class="roles-nav"><a href="tecnico.html">Panel general</a><a href="detalle-sucursal.html">Detalle de sucursal</a><a href="historial-incidencias.html">Historial de incidencias</a></nav>
<main class="roles-main"><h1>Historial de incidencias</h1><p>Reportes de todas las sucursales.</p>
<div class="roles-card"><div class="roles-controls"><label>Sucursal <select x-model="sucursal"><option value="todas">Todas</option><option value="centro">Centro</option><option value="norte">Norte</option><option value="sur">Sur</option></select></label>
<label>Fecha <input type="date" x-model="fecha"></label><label>Buscar <input type="search" x-model="buscar" placeholder="Equipo o falla"></label></div>
<div class="roles-table-wrap"><table><thead><tr><th>Sucursal</th><th>Equipo</th><th>Falla</th><th>Fecha de reporte</th><th>Resolución</th></tr></thead><tbody>
<template x-for="i in visibles" :key="i.id"><tr><td x-text="i.sucursal"></td><td x-text="i.equipo"></td><td x-text="i.falla"></td><td x-text="i.fecha"></td><td x-text="i.resolucion"></td></tr></template>
<tr x-show="visibles.length===0"><td colspan="5">No se encontraron incidencias.</td></tr></tbody></table></div></div></main><script src="pwa.js"></script></body></html>
