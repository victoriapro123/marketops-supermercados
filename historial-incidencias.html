<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211a38">
    <title>Historial de incidencias | MarketOps</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="roles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <script defer src="demo-roles.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="tecnico-view" x-data="demoHistorial(false)">
    <a class="skip-link" href="#contenido">Ir al contenido</a>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="tecnico.html"><span class="brand-mark" aria-hidden="true"></span>MarketOps</a>
            <nav class="sidebar-nav" aria-label="Navegación principal">
                <a class="nav-dashboard" href="tecnico.html">Panel general</a>
                <a class="nav-equipment" href="detalle-sucursal.html">Detalle de sucursal</a>
                <a class="nav-history" href="historial-incidencias.html" aria-current="page">Historial de incidencias</a>
            </nav>
            <div class="sidebar-bottom">
                <a class="sidebar-exit" href="index.html">Cerrar sesión</a>
            </div>
        </aside>
        <div class="app-main">
            <header class="topbar">
                <span class="topbar-role">Técnico de soporte</span>
            </header>
            <main class="workspace" id="contenido">
                <div class="page-heading"><h1>Historial de incidencias</h1></div>
                <section class="panel" aria-labelledby="tituloIncidencias">
                    <div class="panel-head"><h2 id="tituloIncidencias">Registro de fallas</h2></div>
                    <div class="filters" x-cloak>
                        <div class="field">
                            <label for="sucursal">Sucursal</label>
                            <select id="sucursal" x-model="sucursal"><option value="todas">Todas</option><option value="centro">Centro</option><option value="norte">Norte</option><option value="sur">Sur</option></select>
                        </div>
                        <div class="field"><label for="fechaFalla">Fecha del reporte</label><input id="fechaFalla" type="date" x-model="fecha"></div>
                        <div class="field"><label for="buscarFalla">Buscar</label><input id="buscarFalla" type="search" x-model="buscar" placeholder="Equipo o falla"></div>
                    </div>
                    <div class="table-scroll" tabindex="0" role="region" aria-labelledby="tituloIncidencias">
                        <table>
                            <thead><tr><th scope="col">Sucursal</th><th scope="col">Equipo</th><th scope="col">Falla</th><th scope="col">Fecha de reporte</th><th scope="col">Resolución</th></tr></thead>
                            <tbody>
                                <template x-for="i in visibles" :key="i.id">
                                    <tr><td x-text="i.sucursal"></td><td x-text="i.equipo"></td><td class="incident-text" x-text="i.falla"></td><td x-text="i.fecha"></td><td x-text="i.resolucion"></td></tr>
                                </template>
                                <tr x-cloak x-show="visibles.length===0"><td colspan="5">No se encontraron incidencias.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="pwa.js"></script>
</body>
</html>
